name: Pipeline E2E MedConnect

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *' # Se ejecuta diariamente a las 2:00 AM UTC

jobs:
  cypress-tests:
    name: Pruebas Cypress (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          cd cypress-js
          npm ci

      - name: Ejecutar Pruebas Cypress
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://v0-medconnect-booking-app.vercel.app/' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin@medconnect.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin123' }}
        run: |
          cd cypress-js
          npx cypress run

      - name: Publicar Evidencias Cypress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: cypress-js/cypress/reports/

  playwright-java-tests:
    name: Pruebas Playwright (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias para Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Ejecutar Pruebas con Maven
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://v0-medconnect-booking-app.vercel.app/' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin@medconnect.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin123' }}
        run: |
          cd playwright-java
          xvfb-run mvn test

      - name: Publicar Evidencias Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-playwright
          path: playwright-java/target/allure-results/

  selenium-java-tests:
    name: Pruebas Selenium (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias para Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb google-chrome-stable

      - name: Ejecutar Pruebas con Maven
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://v0-medconnect-booking-app.vercel.app/' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin@medconnect.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin123' }}
        run: |
          cd selenium-java
          xvfb-run mvn test

      - name: Publicar Evidencias Selenium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-selenium
          path: selenium-java/target/evidencias/