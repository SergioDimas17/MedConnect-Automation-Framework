name: Pipeline E2E MedConnect

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-tests:
    name: Pruebas Cypress (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: |
          cd cypress-js
          npm ci

      - name: Ejecutar Pruebas Cypress
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://v0-medconnect-booking-app.vercel.app/' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin@medconnect.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin123' }}
        run: |
          cd cypress-js
          npx cypress run

  playwright-java-tests:
    name: Pruebas Playwright (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias para Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Ejecutar Pruebas con Maven
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://v0-medconnect-booking-app.vercel.app/' }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin@medconnect.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'Admin123' }}
          DISPLAY: :99
        run: |
          cd playwright-java
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          mvn test